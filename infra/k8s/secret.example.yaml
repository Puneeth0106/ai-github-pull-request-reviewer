# Copy to secret.yaml (ignored), replace every placeholder, then apply that file.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: "REPLACE_WITH_RANDOM_WEBHOOK_SECRET"
  GITHUB_APP_ID: "REPLACE_WITH_GITHUB_APP_ID"
  GITHUB_APP_PRIVATE_KEY: "REPLACE_WITH_PRIVATE_KEY_USING_LITERAL_BACKSLASH_N"
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
  LANGFUSE_PUBLIC_KEY: "REPLACE_WITH_LANGFUSE_PUBLIC_KEY"
  LANGFUSE_SECRET_KEY: "REPLACE_WITH_LANGFUSE_SECRET_KEY"
  DATABASE_URL: "postgresql+asyncpg://DB_USER:DB_PASSWORD@DB_HOST:5432/codereviewer"
